name: CI on Pull Request

on:
  pull_request:
    branches:
      - '**'

permissions:
  statuses: write

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Download and start Papercut SMTP
      run: |
        Invoke-WebRequest https://github.com/ChangemakerStudios/Papercut-SMTP/releases/latest/download/PapercutSMTP-win-x64-stable-Portable.zip -OutFile PapercutSMTP.zip
        Expand-Archive PapercutSMTP.zip -DestinationPath Papercut
        $exePath = Get-ChildItem -Recurse -Filter "Papercut SMTP.exe" -Path ".\Papercut" | Select-Object -First 1 | Select-Object -ExpandProperty FullName
        Write-Host "Found Papercut at $exePath"
        Start-Process -FilePath $exePath -ArgumentList "--AllowInsecure" -WindowStyle Hidden
        Start-Sleep -Seconds 5

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration Release --no-restore

    - name: Run tests with coverage
      run: dotnet test --configuration Release --no-restore --verbosity normal --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory ./TestResults

    - name: Install ReportGenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool

    - name: Generate coverage report
      run: reportgenerator -reports:"./TestResults/**/coverage.cobertura.xml" -targetdir:"./TestResults/CoverageReport" -reporttypes:"Cobertura;JsonSummary"

    - name: Post coverage status
      if: github.event_name == 'pull_request'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        COVERAGE=$(python3 -c "
        import json
        with open('./TestResults/CoverageReport/Summary.json') as f:
            data = json.load(f)
        print(round(data['summary']['linecoverage'], 1))
        ")

        echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"

        echo "### Code Coverage" >> "$GITHUB_STEP_SUMMARY"
        echo "Line coverage: **${COVERAGE}%**" >> "$GITHUB_STEP_SUMMARY"

        gh api repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
          -f state="success" \
          -f context="code-coverage" \
          -f description="Line coverage: ${COVERAGE}%" \
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ./TestResults/CoverageReport/

    - name: Stop Papercut SMTP
      if: always()
      run: |
        Get-Process "Papercut SMTP" -ErrorAction SilentlyContinue | Stop-Process -Force
